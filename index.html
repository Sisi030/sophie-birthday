<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HAPPY BIRTHDAY SOPHIE</title>
<style>
/* ══════════════════════════════════════════════
   BASE & RESET — TERMINAL EDITION
   ══════════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --term-green: #00ff41;
  --term-green-dim: #00cc33;
  --term-green-dark: #003300;
  --term-bg: #050508;
  --text-dim: rgba(0,255,65,0.4);
  --text-mid: rgba(0,255,65,0.7);
  --font-mono: 'Courier New', 'Consolas', 'Lucida Console', monospace;
  --gold: #ffc857;
}

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background: var(--term-bg);
  color: var(--term-green);
  font-family: var(--font-mono);
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

/* ══════════════════════════════════════════════
   CRT OVERLAY
   ══════════════════════════════════════════════ */
#crt-overlay {
  position:fixed; inset:0; pointer-events:none; z-index:999;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.04) 0px,
    rgba(0,0,0,0.04) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: multiply;
}
#crt-overlay::after {
  content:''; position:absolute; inset:0;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
  pointer-events:none;
}

/* ══════════════════════════════════════════════
   SCREENS
   ══════════════════════════════════════════════ */
.screen {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0; visibility:hidden;
  transition: opacity 1.2s ease, visibility 1.2s ease;
  flex-direction:column;
  padding:1.5rem;
}
.screen.active {
  opacity:1; visibility:visible;
}

/* ══════════════════════════════════════════════
   SCREEN 1 — BOOT
   ══════════════════════════════════════════════ */
#screen-boot {
  background: var(--term-bg);
  font-family: var(--font-mono);
  justify-content:flex-start;
  padding-top:12vh;
}
#boot-text {
  font-size: clamp(0.75rem, 2.2vw, 1.1rem);
  color: var(--term-green);
  line-height: 1.8;
  max-width: 44rem;
  width:100%;
  text-shadow: 0 0 8px rgba(0,255,65,0.25);
}
#boot-text .line { opacity:0; }
#boot-text .line.visible { opacity:1; }

/* Signal Strength Bar — inline in boot-text */
#signal-bar-container {
  width:100%;
  margin: 3px 0 3px 0;
  display:none;
}
#signal-bar-label {
  font-size: clamp(0.75rem, 2.2vw, 1.1rem);
  color: var(--term-green);
  text-shadow: 0 0 8px rgba(0,255,65,0.25);
  line-height: 1.8;
}
#signal-bar-track {
  width:100%;
  height: 18px;
  background: rgba(0,255,65,0.08);
  border: 1px solid rgba(0,255,65,0.25);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
  margin-top: 2px;
}
#signal-bar-fill {
  height:100%;
  width:0%;
  background: linear-gradient(90deg, rgba(0,255,65,0.4), var(--term-green));
  box-shadow: 0 0 12px rgba(0,255,65,0.3);
  transition: width 0.15s linear;
  position: relative;
}
#signal-bar-fill::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 20px;
  background: linear-gradient(90deg, transparent, rgba(0,255,65,0.6));
}
#signal-bar-pct {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.7em;
  color: #000;
  font-weight: bold;
  font-family: var(--font-mono);
  mix-blend-mode: difference;
}

#boot-prompt {
  color: var(--term-green);
  font-size: clamp(0.75rem, 2.2vw, 1.1rem);
  margin-top: 1.5rem;
  opacity:0;
  transition: opacity 0.8s ease;
  cursor: pointer;
  padding:0.5rem 1rem;
  border:1px solid transparent;
}
#boot-prompt.show { opacity:0.9; }
#boot-prompt:hover { border-color:rgba(0,255,65,0.3); }
#boot-prompt .blink { animation: blink 1s step-end infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

/* ══════════════════════════════════════════════
   SCREEN 2 — TITLE (Terminal Style)
   ══════════════════════════════════════════════ */
#screen-title {
  background: var(--term-bg);
  text-align:center;
  font-family: var(--font-mono);
  display:flex;
  align-items:center;
  justify-content:center;
}

.title-container {
  position:relative;
  padding: 1.5rem 1rem;
  border: 1px solid rgba(0,255,65,0.15);
  max-width: min(90vw, 640px);
  width: 100%;
  margin: 0 auto;
}
.title-container::before {
  content: '┌─────────────────────────────────────────────────────────┐';
  position:absolute;
  top: -0.55rem; left: 50%;
  transform: translateX(-50%);
  font-size: clamp(0.35rem, 1vw, 0.6rem);
  color: var(--term-green-dim);
  white-space: pre;
  opacity:0.15;
  pointer-events:none;
  display:none;
}
.title-container::after {
  content: '└─────────────────────────────────────────────────────────┘';
  position:absolute;
  bottom: -0.55rem; left: 50%;
  transform: translateX(-50%);
  font-size: clamp(0.35rem, 1vw, 0.6rem);
  color: var(--term-green-dim);
  white-space: pre;
  opacity:0.15;
  pointer-events:none;
  display:none;
}

.term-title {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: clamp(1.4rem, 6vw, 4.5rem);
  letter-spacing: 0.12em;
  color: var(--term-green);
  text-shadow:
    0 0 10px rgba(0,255,65,0.3),
    0 0 30px rgba(0,255,65,0.1);
  line-height: 1.3;
  margin: 0.3rem 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.4em;
}
.term-title .word { display: inline-block; }

.term-letter {
  display:inline-block;
  opacity:0;
  transform: translateY(-20px) scale(0.5);
  transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1),
              transform 0.5s cubic-bezier(0.22,1,0.36,1);
}
.term-letter.show {
  opacity:1;
  transform: translateY(0) scale(1);
}
.term-letter.glitch {
  animation: term-glitch 0.25s ease forwards;
}
@keyframes term-glitch {
  0%   { transform: translate(0); text-shadow: 0 0 10px rgba(0,255,65,0.3); }
  20%  { transform: translate(-2px, 1px); text-shadow: -2px 0 #00ff41, 2px 0 #ff00ff; }
  40%  { transform: translate(2px, -1px); text-shadow: 2px 0 #00ff41, -2px 0 #ff00ff; }
  60%  { transform: translate(-1px, 0); }
  80%  { transform: translate(1px, 0); }
  100% { transform: translate(0); text-shadow: 0 0 10px rgba(0,255,65,0.3); }
}

.term-subtitle {
  font-family: var(--font-mono);
  font-size: clamp(0.6rem, 1.5vw, 0.85rem);
  letter-spacing: 0.3em;
  color: var(--text-mid);
  margin-top: 0.8rem;
  opacity:0;
  transition: opacity 0.8s ease 1.5s;
}
.term-subtitle.show { opacity:0.7; }

.term-date {
  font-family: var(--font-mono);
  font-size: clamp(0.55rem, 1.3vw, 0.75rem);
  letter-spacing: 0.2em;
  color: var(--text-dim);
  margin-top: 0.6rem;
  opacity:0;
  transition: opacity 0.8s ease 2s;
}
.term-date.show { opacity:0.5; }

.term-sound-hint {
  font-family: var(--font-mono);
  font-size: clamp(0.5rem, 1.1vw, 0.65rem);
  color: rgba(0,255,65,0.35);
  margin-top: 0.4rem;
  opacity:0;
  transition: opacity 1s ease 3s;
}
.term-sound-hint.show { opacity:0.4; }

.term-click-hint {
  font-family: var(--font-mono);
  font-size: clamp(0.7rem, 1.5vw, 0.9rem);
  color: var(--term-green);
  margin-top: 2.5rem;
  opacity:0;
  transition: opacity 0.8s ease 2.5s;
  cursor: pointer;
  padding:0.6rem 1.8rem;
  border: 1px solid rgba(0,255,65,0.2);
}
.term-click-hint.show { opacity:0.8; }
.term-click-hint:hover {
  background: rgba(0,255,65,0.05);
  border-color: rgba(0,255,65,0.5);
}
.term-click-hint .blink { animation: blink 1s step-end infinite; }

/* ══════════════════════════════════════════════
   SCREEN 3 — GAME (Terminal + Lights)
   ══════════════════════════════════════════════ */
#screen-game {
  background: var(--term-bg);
  overflow:hidden;
}

#game-terminal-frame {
  position:absolute; inset: 1.5rem;
  border: 1px solid rgba(0,255,65,0.08);
  pointer-events:none;
  z-index:0;
}
#game-terminal-frame::before {
  content: '│ BIRTHDAY OS v1.0 // LIGHTS MODE │';
  position:absolute;
  top: -0.6rem; left: 1.5rem;
  background: var(--term-bg);
  padding: 0 0.8rem;
  font-size: clamp(0.5rem, 1.2vw, 0.7rem);
  color: rgba(0,255,65,0.2);
  font-family: var(--font-mono);
  white-space: nowrap;
}
#game-terminal-frame::after {
  content: '│';
  position:absolute;
  bottom: 0.5rem; right: 0.8rem;
  font-size: clamp(0.5rem, 1.2vw, 0.7rem);
  color: rgba(0,255,65,0.15);
  font-family: var(--font-mono);
}

#particle-canvas {
  position:absolute; inset:0;
  pointer-events:none;
  z-index:1;
}

#lights-string {
  position:absolute;
  top:0; left:0; width:100%; height:100%;
  z-index:2;
  pointer-events:none;
}

#lights-container {
  position:relative;
  z-index:3;
  width:100%;
  height:100%;
  max-width: 900px;
  margin: 0 auto;
}

.fairy-light {
  position:absolute;
  width: 64px;
  height: 64px;
  margin-left: -32px;
  margin-top: -32px;
  cursor: pointer;
  z-index:3;
  transition: transform 0.3s ease;
}
.fairy-light { animation: fairy-flicker 0s ease-in-out infinite; }
.fairy-light:hover { transform: scale(1.15); }
.fairy-light.lit { cursor: default; animation: light-pulse 2s ease-in-out infinite; }
.fairy-light.locked { animation: lock-shake 0.4s ease; cursor: not-allowed; }
@keyframes lock-shake {
  0%,100% { transform: translateX(0); filter: brightness(1); }
  15%  { transform: translateX(-4px); filter: brightness(0.6); }
  30%  { transform: translateX(4px);  filter: brightness(0.6); }
  45%  { transform: translateX(-2px); filter: brightness(0.8); }
  60%  { transform: translateX(2px);  filter: brightness(0.8); }
  75%  { transform: translateX(-1px); filter: brightness(1); }
}
@keyframes light-pulse {
  0%,100% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
}
@keyframes fairy-flicker {
  0%, 100% { filter: brightness(1); opacity: 1; }
  8%  { filter: brightness(0.3); opacity: 0.6; }
  12% { filter: brightness(1); opacity: 1; }
  18% { filter: brightness(0.5); opacity: 0.7; }
  22% { filter: brightness(1); opacity: 1; }
  48% { filter: brightness(1); opacity: 1; }
  53% { filter: brightness(0.2); opacity: 0.4; }
  57% { filter: brightness(1); opacity: 1; }
  75% { filter: brightness(1); opacity: 1; }
  80% { filter: brightness(0.6); opacity: 0.7; }
  83% { filter: brightness(1); opacity: 1; }
}

.fairy-light .glow {
  position:absolute;
  top:50%; left:50%;
  width:40px; height:40px;
  margin-left:-20px; margin-top:-20px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(255,200,87,0.9) 0%, rgba(255,159,67,0.3) 40%, transparent 70%);
  box-shadow: 0 0 20px rgba(255,200,87,0.4), 0 0 60px rgba(255,200,87,0.15);
  transition: all 0.4s ease;
}
.fairy-light:hover .glow {
  box-shadow: 0 0 30px rgba(255,200,87,0.6), 0 0 80px rgba(255,200,87,0.25);
  transform: scale(1.1);
}
.fairy-light.lit .glow {
  box-shadow: 0 0 40px rgba(255,200,87,0.8), 0 0 100px rgba(255,200,87,0.3);
}

.fairy-light .light-body {
  position:absolute;
  top:50%; left:50%;
  width:14px; height:20px;
  margin-left:-7px; margin-top:-10px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: radial-gradient(ellipse at 50% 40%, #fff8e0 0%, #ffc857 60%, #e8943a 100%);
  box-shadow: 0 0 15px rgba(255,200,87,0.6), inset 0 -2px 4px rgba(0,0,0,0.2);
  transition: all 0.4s ease;
}
.fairy-light.lit .light-body {
  background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #ffd700 50%, #ffaa00 100%);
  box-shadow: 0 0 25px rgba(255,215,0,0.8), 0 0 60px rgba(255,200,87,0.3), inset 0 -2px 4px rgba(0,0,0,0.2);
}

.fairy-light .light-cap {
  position:absolute; top:50%; left:50%;
  width:10px; height:6px;
  margin-left:-5px; margin-top:8px;
  background: #555;
  border-radius: 2px 2px 1px 1px;
  z-index:1;
}
.fairy-light .wire {
  position:absolute; top:50%; left:50%;
  width:2px; height:30px;
  margin-left:-1px; margin-top:-30px;
  background: #444;
  z-index:-1;
}


#progress {
  position:fixed;
  bottom: 2rem;
  left:50%;
  transform: translateX(-50%);
  z-index:20;
  font-family: var(--font-mono);
  font-size: clamp(0.65rem, 1.3vw, 0.8rem);
  color: var(--text-dim);
  letter-spacing: 0.1em;
  opacity:0;
  transition: opacity 0.8s ease;
}
#progress.show { opacity:0.6; }
#progress .count { color: var(--term-green); text-shadow: 0 0 6px rgba(0,255,65,0.3); }

#light-msgs {
  position: fixed;
  bottom: 6rem;
  left: 50%;
  transform: translateX(-50%);
  width: min(85vw, 500px);
  max-height: 150px;
  overflow-y: auto;
  z-index: 15;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0.6rem 0.8rem;
  background: rgba(5,5,8,0.9);
  border: 1px solid rgba(0,255,65,0.12);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: clamp(0.6rem, 1.3vw, 0.8rem);
  color: var(--term-green);
  scrollbar-width: thin;
  scrollbar-color: rgba(0,255,65,0.2) transparent;
  pointer-events: none;
}
#light-msgs .msg-entry {
  opacity: 0;
  animation: msgFadeIn 0.4s ease forwards;
  line-height: 1.5;
}
@keyframes msgFadeIn {
  to { opacity: 0.85; }
}

/* ══════════════════════════════════════════════
   SCREEN 4 — FINAL
   ══════════════════════════════════════════════ */
#screen-final {
  background: var(--term-bg);
  text-align:center;
  font-family: var(--font-mono);
}

#final-terminal-border {
  position:absolute; inset: 1.5rem;
  border: 1px solid rgba(0,255,65,0.08);
  pointer-events:none;
  z-index:0;
}
#final-terminal-border::before {
  content: '│ BIRTHDAY OS v1.0 // FINALIZE │';
  position:absolute;
  top: -0.6rem; left: 1.5rem;
  background: var(--term-bg);
  padding: 0 0.8rem;
  font-size: clamp(0.5rem, 1.2vw, 0.7rem);
  color: rgba(0,255,65,0.2);
  font-family: var(--font-mono);
  white-space: nowrap;
}
#final-terminal-border::after {
  content: '│';
  position:absolute;
  bottom: 0.5rem; right: 0.8rem;
  font-size: clamp(0.5rem, 1.2vw, 0.7rem);
  color: rgba(0,255,65,0.15);
  font-family: var(--font-mono);
}

#final-content {
  position:relative;
  z-index:5;
  max-width: 700px;
  opacity:0;
  transform: translateY(30px);
  transition: opacity 1.2s ease, transform 1.2s ease;
}
#final-content.show { opacity:1; transform: translateY(0); }

#final-icon {
  font-size: clamp(3rem, 10vw, 5rem);
  margin-bottom: 0.8rem;
  opacity:0;
  transform: scale(0);
  transition: opacity 0.8s ease 0.3s, transform 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s;
}
#final-icon.show { opacity:1; transform: scale(1); }

#final-headline {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: clamp(1.3rem, 4vw, 2.5rem);
  letter-spacing: 0.2em;
  color: var(--term-green);
  text-shadow: 0 0 15px rgba(0,255,65,0.3);
  margin-bottom: 1.5rem;
  opacity:0;
  transform: translateY(20px);
  transition: opacity 0.8s ease 0.6s, transform 0.8s ease 0.6s;
  line-height: 1.4;
}
#final-headline.show { opacity:1; transform: translateY(0); }

#final-message {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: clamp(0.7rem, 1.8vw, 1rem);
  line-height: 1.9;
  color: rgba(0,255,65,0.8);
  margin-bottom: 2rem;
  opacity:0;
  transform: translateY(20px);
  transition: opacity 0.8s ease 0.9s, transform 0.8s ease 0.9s;
}
#final-message.show { opacity:1; transform: translateY(0); }
#final-message .highlight { color: var(--gold); font-weight: 400; text-shadow: 0 0 8px rgba(255,200,87,0.3); }

#final-signature {
  font-family: var(--font-mono);
  font-size: clamp(0.8rem, 2vw, 1.2rem);
  color: var(--text-mid);
  letter-spacing: 0.1em;
  opacity:0;
  transition: opacity 0.8s ease 1.2s;
}
#final-signature.show { opacity:0.7; }
#final-signature .heart { color: #ff6b9d; text-shadow: 0 0 10px rgba(255,107,157,0.4); }

#confetti-canvas {
  position:absolute; inset:0;
  pointer-events:none;
  z-index:1;
}

/* ══════════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════════ */
@media (max-width: 768px) {
  .title-container { padding: 1.2rem 0.8rem; }
  .term-title { font-size: clamp(1.2rem, 5vw, 2.2rem); letter-spacing: 0.08em; gap: 0.2em; }
  .term-subtitle { font-size: clamp(0.5rem, 1.3vw, 0.7rem); }
  .term-date { font-size: clamp(0.45rem, 1.1vw, 0.65rem); }
  .term-sound-hint { font-size: clamp(0.4rem, 1vw, 0.55rem); }
  .term-click-hint { font-size: clamp(0.6rem, 1.3vw, 0.8rem); margin-top: 1.5rem; padding:0.5rem 1.2rem; }
  #boot-text { font-size: 0.65rem; }
  #signal-bar-label { font-size: 0.65rem; }
  .fairy-light { width: 48px; height: 48px; margin-left: -24px; margin-top: -24px; }
  .fairy-light .glow { width: 32px; height: 32px; margin-left: -16px; margin-top: -16px; }
  .fairy-light .light-body { width: 11px; height: 16px; margin-left: -5.5px; margin-top: -8px; }
  .fairy-light .light-cap { margin-top: 6px; }
}

@media (max-width: 400px) {
  .term-title { font-size: clamp(1rem, 4.5vw, 1.4rem); letter-spacing: 0.05em; gap: 0.15em; }
  .term-subtitle { font-size: 0.45rem; letter-spacing: 0.15em; }
  .term-date { font-size: 0.4rem; }
  .term-click-hint { font-size: 0.55rem; padding:0.4rem 0.8rem; margin-top: 1rem; }
  .title-container { padding: 1rem 0.5rem; }
  #boot-text { font-size: 0.55rem; }
  #boot-prompt { font-size: 0.55rem; }
}

@media (max-width: 600px) {
  .term-title { letter-spacing: 0.1em; }
}

.glitch-overlay {
  position:fixed; inset:0; pointer-events:none; z-index:100;
  background: rgba(0,255,65,0.02);
  opacity:0;
  animation: none;
}
.glitch-overlay.active {
  animation: term-glitch-flash 0.15s ease 3;
}
@keyframes term-glitch-flash {
  0%,100% { opacity:0; }
  25% { opacity:1; background: rgba(0,255,65,0.02); }
  50% { opacity:0; }
  75% { opacity:1; background: rgba(255,0,255,0.02); }
}
/* ══════════════════════════════════════════════
   SOUND HINT POPUP
   ══════════════════════════════════════════════ */
.sound-hint {
  position:fixed; inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:900;
  opacity:0;
  visibility:hidden;
  transition: opacity 0.4s ease, visibility 0.4s ease;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.sound-hint.show {
  opacity:1;
  visibility:visible;
}
.sound-hint-box {
  background: var(--term-bg);
  border: 1px solid var(--term-green-dim);
  padding: 1.8rem 2.5rem;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,255,65,0.1);
}
.sound-hint-text {
  font-family: var(--font-mono);
  font-size: clamp(0.9rem, 2vw, 1rem);
  color: var(--term-green);

// ─── WEB AUDIO — SFX ───
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}
function playNote(freq, duration, type, gainVal) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) { /* silent fallback */ }
}
function playNoteViolin(freq, duration, gainVal) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    const vibrato = audioCtx.createOscillator();
    const vibratoGain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    vibrato.type = 'sine';
    vibrato.frequency.setValueAtTime(5.5, audioCtx.currentTime);
    vibratoGain.gain.setValueAtTime(3, audioCtx.currentTime);
    vibrato.connect(vibratoGain);
    vibratoGain.connect(osc.frequency);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal || 0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
    vibrato.start();
    vibrato.stop(audioCtx.currentTime + duration);
  } catch(e) { /* silent fallback */ }
}
function playChime() {
  playNoteViolin(523.25, 0.15, 0.12);
  setTimeout(() => playNoteViolin(659.25, 0.15, 0.10), 100);
  setTimeout(() => playNoteViolin(783.99, 0.3, 0.10), 200);
}
function playReveal() {
  const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880];
  notes.forEach((f, i) => {
    setTimeout(() => playNoteViolin(f, 0.2, 0.08), i * 80);
  });
  setTimeout(() => playNoteViolin(1046.5, 0.5, 0.12), notes.length * 80);
}
function playGlitch() {
  playNote(80, 0.05, 'sawtooth', 0.05);
  setTimeout(() => playNote(120, 0.05, 'sawtooth', 0.04), 50);
}

// ─── BACKGROUND MUSIC — Creepy Melodic Drone ───
function startBackgroundMusic() {
  if (bgMusicStarted) return;
  bgMusicStarted = true;
  initAudio();
  if (!audioCtx) return;

  const masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);

  // ── Drone 1: Low ominous C ──
  const drone1 = audioCtx.createOscillator();
  drone1.type = 'sawtooth';
  drone1.frequency.setValueAtTime(65.41, audioCtx.currentTime); // C2
  const drone1Gain = audioCtx.createGain();
  drone1Gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  drone1.connect(drone1Gain);
  drone1Gain.connect(masterGain);

  // ── Drone 2: Detuned for beat frequency creep ──
  const drone2 = audioCtx.createOscillator();
  drone2.type = 'sawtooth';
  drone2.frequency.setValueAtTime(66.0, audioCtx.currentTime); // slightly detuned
  const drone2Gain = audioCtx.createGain();
  drone2Gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  drone2.connect(drone2Gain);
  drone2Gain.connect(masterGain);

  // ── Drone 3: Fifth above ──
  const drone3 = audioCtx.createOscillator();
  drone3.type = 'sawtooth';
  drone3.frequency.setValueAtTime(98.0, audioCtx.currentTime); // G2
  const drone3Gain = audioCtx.createGain();
  drone3Gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  drone3.connect(drone3Gain);
  drone3Gain.connect(masterGain);

  // ── LFO modulation on drone 1 ──
  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(0.15, audioCtx.currentTime); // very slow
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.setValueAtTime(3, audioCtx.currentTime);
  lfo.connect(lfoGain);
  lfoGain.connect(drone1.frequency);

  // ── Subtle filter sweep ──
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(400, audioCtx.currentTime);
  filter.Q.setValueAtTime(1, audioCtx.currentTime);
  const filterLfo = audioCtx.createOscillator();
  filterLfo.type = 'sine';
  filterLfo.frequency.setValueAtTime(0.08, audioCtx.currentTime);
  const filterLfoGain = audioCtx.createGain();
  filterLfoGain.gain.setValueAtTime(150, audioCtx.currentTime);
  filterLfo.connect(filterLfoGain);
  filterLfoGain.connect(filter.frequency);

  // Reconnect drones through filter
  drone1.disconnect(drone1Gain);
  drone2.disconnect(drone2Gain);
  drone3.disconnect(drone3Gain);
  drone1.connect(filter);
  drone2.connect(filter);
  drone3.connect(filter);
  filter.connect(drone1Gain);

  // ── Drone only — no melody, just pure bass ──
  // No scheduled notes, only the continuous low drones above

  // Start nodes
  drone1.start();
  drone2.start();
  drone3.start();
  lfo.start();
  filterLfo.start();

  // No melody starter — drone only

  // Store references for cleanup
  bgMusicNodes = [drone1, drone2, drone3, lfo, filterLfo];
}

function tryStartBgMusic() {
  // Called on any user interaction — browser policy requires
  // AudioContext resume / creation on user gesture
  if (!bgMusicStarted) {
    startBackgroundMusic();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// ─── SCREEN MANAGEMENT ───

// ─── SIGNAL STRENGTH BAR ───
function animateSignalBar(onComplete) {
  const container = document.createElement('div');
  container.className = 'line visible';
  container.style.width = '100%';
  container.style.margin = '3px 0 3px 0';

  const label = document.createElement('div');

  track.style.cssText = 'width:100%;height:18px;background:rgba(0,255,65,0.08);border:1px solid rgba(0,255,65,0.25);border-radius:2px;position:relative;overflow:hidden;margin-top:2px;';

  const fill = document.createElement('div');
  fill.style.cssText = 'height:100%;width:0%;background:linear-gradient(90deg,rgba(0,255,65,0.4),#00ff41);position:relative;transition:width 0.15s linear;';

  const pctSpan = document.createElement('span');
  pctSpan.style.cssText = 'position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:0.7em;color:#000;font-weight:bold;font-family:var(--font-mono);mix-blend-mode:difference;';
  pctSpan.textContent = '0%';

  fill.appendChild(pctSpan);
  track.appendChild(fill);
  container.appendChild(label);
  container.appendChild(track);
  bootText.appendChild(container);

  let progress = 0;
  const duration = 2500;
  const step = 30;
  const increment = 100 / (duration / step);

  function tick() {
    progress = Math.min(100, progress + increment);
    fill.style.width = progress + '%';
    pctSpan.textContent = Math.round(progress) + '%';
    label.textContent = '> Signalstärke: ' + Math.round(progress) + '%';

    if (progress === 33) playNote(300, 0.05, 'sine', 0.03);
    if (progress === 66) playNote(400, 0.05, 'sine', 0.03);
    if (progress === 100) {
      playNote(523.25, 0.1, 'sine', 0.05);
      fill.style.boxShadow = '0 0 20px rgba(0,255,65,0.5)';
    }

    if (progress < 100) {
      setTimeout(tick, step);
    } else {
      if (onComplete) setTimeout(onComplete, 200);
    }
  }
  tick();
}

// ─── BOOT SCREEN ───
let bootSignalBarDone = false;

function bootSequence() {
  let lineIdx = 0;
  let charIdx = 0;
  let currentLineEl = null;
  let isComplete = false;

  function addLine() {
    if (lineIdx >= BOOT_LINES.length) {
      if (bootSignalBarDone) {
        isComplete = true;
        bootPrompt.classList.add('show');
      }
      return;
    }
    const lineData = BOOT_LINES[lineIdx];

    // Special marker for signal bar
    if (lineData.text === '> SIGNAL_BAR') {
      animateSignalBar(() => {
        bootSignalBarDone = true;
        if (lineIdx >= BOOT_LINES.length) {
          isComplete = true;
          bootPrompt.classList.add('show');
        } else {
          addLine();
        }
      });
      lineIdx++;
      return;
    }

    const lineDiv = document.createElement('div');
    lineDiv.className = 'line';
    bootText.appendChild(lineDiv);
    currentLineEl = lineDiv;

    if (lineData.text === '') {
      lineDiv.innerHTML = '&nbsp;';
      lineDiv.classList.add('visible');
      lineIdx++;
      setTimeout(addLine, lineData.delay);
      return;
    }

    charIdx = 0;
    typeChar();
  }

  function typeChar() {
    if (!currentLineEl) return;
    const text = BOOT_LINES[lineIdx].text;
    if (charIdx < text.length) {
      if (charIdx === 0) currentLineEl.classList.add('visible');
      currentLineEl.textContent += text[charIdx];
      charIdx++;
      const speed = text[charIdx-1] === ' ' ? 25 : 15 + Math.random() * 20;
      setTimeout(typeChar, speed);
    } else {
      lineIdx++;
      setTimeout(addLine, BOOT_LINES[lineIdx] ? BOOT_LINES[lineIdx].delay : 200);
    }
  }

  addLine();

  // Keyboard/touch skip
  function skipBoot(e) {
    if (!isComplete) return;
    e.preventDefault();
    tryStartBgMusic();
    bootPrompt.removeEventListener('click', skipBoot);
    document.removeEventListener('keydown', skipBoot);
    transitionToTitle();
  }
  bootPrompt.addEventListener('click', skipBoot);
  document.addEventListener('keydown', skipBoot);
}

// ─── PARTICLE SYSTEM ───
function initParticles(canvas) {
  const ctx = canvas.getContext('2d');
  let w, h;

  function resize() {
    w = canvas.width = canvas.parentElement.clientWidth;
    h = canvas.height = canvas.parentElement.clientHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particleList = [];
  const count = 60;

  for (let i = 0; i < count; i++) {
    particleList.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.2,
      vy: -(0.05 + Math.random() * 0.15),
      size: 0.5 + Math.random() * 1.5,
      alpha: 0.1 + Math.random() * 0.3,
      pulseSpeed: 0.005 + Math.random() * 0.01,
      pulsePhase: Math.random() * Math.PI * 2,
    });
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    const time = Date.now();

    particleList.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10 || p.x > w + 10) { p.x = Math.random() * w; p.y = Math.random() * h * 0.5; }

      const pulse = 0.5 + 0.5 * Math.sin(time * p.pulseSpeed + p.pulsePhase);
      const alpha = p.alpha * pulse;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,255,65,${alpha * 0.2})`;
      ctx.fill();

      if (p.size > 1) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,255,65,${alpha * 0.03})`;
        ctx.fill();
      }
    });

    animFrame = requestAnimationFrame(animate);
  }

  animate();
  return () => { cancelAnimationFrame(animFrame); };
}

// ─── GAME: FAIRY LIGHTS ───
function initGame() {
  initParticles(particleCanvas);

  const container = lightsContainer;
  const cw = container.clientWidth || 900;
  const ch = container.clientHeight || 600;

  const positions = [];
  const margin = 80;
  const usableW = cw - margin * 2;
  const usableH = ch - margin * 2;

  for (let i = 0; i < totalLights; i++) {
    const t = i / (totalLights - 1);
    const x = margin + t * usableW;
    const arc = Math.sin(t * Math.PI) * 0.35;
    const y = margin + usableH * (0.3 + arc * 0.4);
    positions.push({ x, y });
  }

  let pathD = `M${positions[0].x},${positions[0].y}`;
  if (positions.length === 6) {
    pathD = `M${positions[0].x},${positions[0].y}
             Q${(positions[0].x+positions[1].x)/2},${(positions[0].y+positions[1].y)/2 - 20}
               ${positions[1].x},${positions[1].y}
             Q${(positions[1].x+positions[2].x)/2},${(positions[1].y+positions[2].y)/2 - 15}
               ${positions[2].x},${positions[2].y}
             Q${(positions[2].x+positions[3].x)/2},${(positions[2].y+positions[3].y)/2 - 10}
               ${positions[3].x},${positions[3].y}
             Q${(positions[3].x+positions[4].x)/2},${(positions[3].y+positions[4].y)/2 - 15}
               ${positions[4].x},${positions[4].y}
             Q${(positions[4].x+positions[5].x)/2},${(positions[4].y+positions[5].y)/2 - 20}
               ${positions[5].x},${positions[5].y}`;
  }
  stringPath.setAttribute('d', pathD);

  LIGHT_MESSAGES.forEach((data, i) => {
    const pos = positions[i];
    const el = document.createElement('div');
    el.className = 'fairy-light';
    el.style.animationDuration = (2 + Math.random() * 5) + 's';
    el.style.animationDelay = (Math.random() * 4) + 's';
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    el.dataset.index = i;
    el.setAttribute('aria-label', `Fairy light ${i+1}`);

    el.innerHTML = `
      <div class="glow"></div>
      <div class="wire"></div>
      <div class="light-body"></div>
      <div class="light-cap"></div>
    `;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      lightUp(el, i);
    });
    el.addEventListener('touchend', (e) => {
      e.preventDefault();
      lightUp(el, i);
    });

    container.appendChild(el);
    lightElements.push(el);

    el.style.opacity = '0';
    el.style.transform = 'scale(0)';
    setTimeout(() => {
      el.style.transition = 'opacity 0.6s cubic-bezier(0.22,1,0.36,1), transform 0.6s cubic-bezier(0.22,1,0.36,1)';
      el.style.opacity = '1';
      el.style.transform = 'scale(1)';
    }, 300 + i * 200);
  });
}

let gameComplete = false;

function lightUp(el, index) {
  if (el.classList.contains('lit') || gameComplete) return;

  // Left-to-right: only the next light in sequence can be lit
  if (index !== lightsLit) {
    el.classList.add('locked');
    setTimeout(() => el.classList.remove('locked'), 500);
    return;
  }

  el.classList.add('lit');
  lightsLit++;
  progressCount.textContent = lightsLit;

  const msgLog = $('#light-msgs');
  const entry = document.createElement('div');
  entry.className = 'msg-entry';
  entry.textContent = '> ' + LIGHT_MESSAGES[index].icon + ' ' + LIGHT_MESSAGES[index].msg;
  msgLog.appendChild(entry);
  msgLog.scrollTop = msgLog.scrollHeight;

  playChime();
  triggerGlitch();

  if (lightsLit >= totalLights) {
    gameComplete = true;
    setTimeout(transitionToFinal, 1500);
  }
}

// ─── TRANSITION: GAME → FINAL ───
function transitionToFinal() {
  playReveal();
  triggerGlitch();

  lightElements.forEach(el => {
    el.style.transition = 'filter 0.3s ease';
    el.style.filter = 'brightness(2)';
    setTimeout(() => { el.style.filter = 'brightness(1)'; }, 300);
  });

  showScreen('final');
  animateFinal();
}

// ─── FINAL SCREEN ───
function animateFinal() {
  initConfetti();

  setTimeout(() => finalContent.classList.add('show'), 200);
  setTimeout(() => finalIcon.classList.add('show'), 600);
  setTimeout(() => finalHeadline.classList.add('show'), 1000);

  setTimeout(() => {
    finalMessage.classList.add('show');
    typeFinalMessage();
  }, 1400);

  setTimeout(() => finalSignature.classList.add('show'), 2800);

  // Restart on click after final screen is complete
  setTimeout(() => {
    screenFinal.addEventListener('click', function restartPage() {
      window.location.reload();
    });
    screenFinal.addEventListener('touchend', function restartPage(e) {
      e.preventDefault();
      window.location.reload();
    });
  }, 4000); // wait for all animations to finish
}

function typeFinalMessage() {
  finalMessage.innerHTML = FINAL_LINES.map(line => {
    if (line === '') return '<br>';
    return `<div style="margin-bottom:0.3rem;">${line}</div>`;
  }).join('');
  finalMessage.style.opacity = '0';
  finalMessage.style.transition = 'opacity 1.2s ease';
  setTimeout(() => { finalMessage.style.opacity = '1'; }, 100);
}

// ─── CONFETTI ───
function initConfetti() {
  const canvas = confettiCanvas;
  const ctx = canvas.getContext('2d');
  let w, h;

  function resize() {
    w = canvas.width = canvas.parentElement.clientWidth;
    h = canvas.height = canvas.parentElement.clientHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const items = [];
  const colors = ['#00ff41', '#ff6b9d', '#ffc857', '#2dd4bf', '#ff9f43', '#a855f7', '#60a5fa'];
  const count = 150;

  for (let i = 0; i < count; i++) {
    items.push({
      x: Math.random() * w,
      y: Math.random() * h - h,
      w: 4 + Math.random() * 8,
      h: 4 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: 0.5 + Math.random() * 1.5,
      vx: (Math.random() - 0.5) * 0.5,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.02,
      opacity: 0.6 + Math.random() * 0.4,
    });
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);

    items.forEach(p => {
      p.y += p.vy;
      p.x += p.vx;
      p.rotation += p.rotSpeed;

      if (p.y > h + 20) {
        p.y = -20;
        p.x = Math.random() * w;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });

    requestAnimationFrame(animate);
  }
  animate();
}

// ─── UPSIDE DOWN PARTICLES — Stranger Things Style ───
function initUpsideDownParticles() {
  const canvas = document.getElementById('upside-down-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = 150;
  const particles = [];
  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h * -1 - Math.random() * 200,
      size: 3 + Math.random() * 5,
      speed: 0.4 + Math.random() * 0.8,
      drift: (Math.random() - 0.5) * 0.3,
      alpha: 0.5 + Math.random() * 0.4,
      hue: Math.floor(Math.random() * 8),
      phase: Math.random() * Math.PI * 2,
    });
  }

  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, w, h);
    frame++;

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.y += p.speed;
      p.x += p.drift + Math.sin(frame * 0.005 + p.phase) * 0.25;

      if (p.y > h + 10) {
        p.y = -10 - Math.random() * 100;
        p.x = Math.random() * w;
      }

      // Pulsing opacity
      const pulse = 0.7 + 0.3 * Math.sin(frame * 0.004 + p.phase);
      const a = p.alpha * pulse;

      // Glow halo
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 90%, 50%, ${a * 0.25})`;
      ctx.fill();

      // Core dot
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${a})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
}

})();
</script>
